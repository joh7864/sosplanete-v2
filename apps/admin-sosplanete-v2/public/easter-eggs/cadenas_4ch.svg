<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 460" width="390" height="460" style="background:transparent; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Shackle chrome gradient -->
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Padlock body gold gradient -->
    <linearGradient id="lockBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Card background gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>

    <!-- Cyan glow filter -->
    <filter id="cyanGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="lockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ==================== CADENAS 3D (TOP) ==================== -->
  <g transform="translate(155, 6)">
    <!-- Shackle (Anse Métallique) -->
    <path d="M 22 34 V 18 C 22 9 30 3 40 3 C 50 3 58 9 58 18 V 34"
          stroke="url(#shackleGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- Lock Body (Corps Doré) -->
    <rect x="8" y="26" width="64" height="48" rx="12"
          fill="url(#lockBodyGrad)" stroke="rgba(254, 240, 138, 0.7)" stroke-width="1.2"
          filter="url(#lockGlow)"/>

    <!-- 4 Dials (Roulettes) -->
    <g transform="translate(13, 33)">
      <rect width="11" height="34" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <polygon points="5.5,2.5 2.5,5.5 8.5,5.5" fill="#fde047"/>
      <text x="5.5" y="20" fill="#ffffff" font-size="9" font-weight="900" text-anchor="middle" font-family="sans-serif">?</text>
      <polygon points="5.5,31.5 2.5,28.5 8.5,28.5" fill="#fde047"/>
    </g>
    <g transform="translate(26.5, 33)">
      <rect width="11" height="34" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <polygon points="5.5,2.5 2.5,5.5 8.5,5.5" fill="#fde047"/>
      <text x="5.5" y="20" fill="#ffffff" font-size="9" font-weight="900" text-anchor="middle" font-family="sans-serif">?</text>
      <polygon points="5.5,31.5 2.5,28.5 8.5,28.5" fill="#fde047"/>
    </g>
    <g transform="translate(40, 33)">
      <rect width="11" height="34" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <polygon points="5.5,2.5 2.5,5.5 8.5,5.5" fill="#fde047"/>
      <text x="5.5" y="20" fill="#ffffff" font-size="9" font-weight="900" text-anchor="middle" font-family="sans-serif">?</text>
      <polygon points="5.5,31.5 2.5,28.5 8.5,28.5" fill="#fde047"/>
    </g>
    <g transform="translate(53.5, 33)">
      <rect width="11" height="34" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <polygon points="5.5,2.5 2.5,5.5 8.5,5.5" fill="#fde047"/>
      <text x="5.5" y="20" fill="#ffffff" font-size="9" font-weight="900" text-anchor="middle" font-family="sans-serif">?</text>
      <polygon points="5.5,31.5 2.5,28.5 8.5,28.5" fill="#fde047"/>
    </g>
  </g>

  <!-- ==================== 5 CAPSULES / WIDGETS (LIGNE UNIQUE) ==================== -->

  <!-- CARTE 1 : 4839 -->
  <g transform="translate(14, 88)">
    <rect width="362" height="52" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="20" y="37" fill="#ffffff" font-size="28" font-weight="900" font-family="'Impact', 'Arial Black', sans-serif" letter-spacing="2">4839</text>
    <text x="250" y="33" fill="#22c55e" font-size="13" font-weight="900" text-anchor="middle">1 BON, BIEN PLACÉ</text>
  </g>

  <!-- CARTE 2 : 7251 -->
  <g transform="translate(14, 150)">
    <rect width="362" height="52" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="20" y="37" fill="#ffffff" font-size="28" font-weight="900" font-family="'Impact', 'Arial Black', sans-serif" letter-spacing="2">7251</text>
    <text x="250" y="33" fill="#22c55e" font-size="13" font-weight="900" text-anchor="middle">2 BONS DONT 1 BIEN PLACÉ</text>
  </g>

  <!-- CARTE 3 : 8063 -->
  <g transform="translate(14, 212)">
    <rect width="362" height="52" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="20" y="37" fill="#ffffff" font-size="28" font-weight="900" font-family="'Impact', 'Arial Black', sans-serif" letter-spacing="2">8063</text>
    <text x="205" y="33" fill="#22c55e" font-size="13" font-weight="900">1 BON,</text>
    <text x="256" y="33" fill="#ef4444" font-size="13" font-weight="900">MAL PLACÉ</text>
  </g>

  <!-- CARTE 4 : 9513 -->
  <g transform="translate(14, 274)">
    <rect width="362" height="52" rx="12" fill="url(#cardBg)" stroke="#ef4444" stroke-width="2" opacity="0.95"/>
    <text x="20" y="37" fill="#ffffff" font-size="28" font-weight="900" font-family="'Impact', 'Arial Black', sans-serif" letter-spacing="2">9513</text>
    <line x1="18" y1="28" x2="110" y2="28" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <text x="250" y="33" fill="#ef4444" font-size="13" font-weight="900" text-anchor="middle">AUCUN N'EST BON</text>
  </g>

  <!-- CARTE 5 : 7046 -->
  <g transform="translate(14, 336)">
    <rect width="362" height="52" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="2" filter="url(#cyanGlow)"/>
    <text x="20" y="37" fill="#ffffff" font-size="28" font-weight="900" font-family="'Impact', 'Arial Black', sans-serif" letter-spacing="2">7046</text>
    <text x="195" y="33" fill="#22c55e" font-size="13" font-weight="900">3 BONS,</text>
    <text x="252" y="33" fill="#ef4444" font-size="13" font-weight="900">MAL PLACÉS</text>
  </g>

  <!-- Question finale en bas -->
  <text x="195" y="425" fill="#00ffcc" font-size="14.5" font-weight="900" text-anchor="middle" letter-spacing="0.6">
    Quelle est la bonne combinaison ?
  </text>
</svg>
