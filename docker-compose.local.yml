version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sos_db_local
    environment:
      - POSTGRES_DB=nnauru
      - POSTGRES_USER=nnauru
      - POSTGRES_PASSWORD=me4nnauru
    ports:
      - "5433:5432"
    volumes:
      - sos_db_data_v2:/var/lib/postgresql/data
    networks:
      - sos_local_net

  jeu:
    image: sosplanete-v2-jeu
    container_name: sos_jeu_v1
    ports:
      - "8080:80"
    networks:
      - sos_local_net

networks:
  sos_local_net:

volumes:
  sos_db_data_v2: # Utilise le même nom que la prod pour la cohérence
