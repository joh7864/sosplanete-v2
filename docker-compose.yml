version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sos_db_v2
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nnauru}
      - POSTGRES_USER=${POSTGRES_USER:-nnauru}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-me4nnauru}
    volumes:
      - sos_db_data_v2:/var/lib/postgresql/data
    networks:
      - sos_internal

  backend:
    build: ./apps/backend-v2
    container_name: sos_backend_v2
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nnauru}:${POSTGRES_PASSWORD:-me4nnauru}@db:5432/${POSTGRES_DB:-nnauru}?schema=public
      - PORT=3011
      - NODE_ENV=production
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/uploads}
      - SWAGGER_USER=${SWAGGER_USER:-admin}
      - SWAGGER_PASSWORD=${SWAGGER_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - sos_internal
      - wagmoo_wagmoo_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wagmoo_wagmoo_net"
      - "traefik.http.routers.sos-api.rule=Host(`api.sosplanete.nnauru.net`)"
      - "traefik.http.routers.sos-api.entrypoints=websecure"
      - "traefik.http.routers.sos-api.tls.certresolver=myresolver"
      - "traefik.http.services.sos-api.loadbalancer.server.port=3011"

  admin:
    build:
      context: ./apps/admin-sosplanete-v2
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.sosplanete.nnauru.net}
    container_name: sos_admin_v2
    restart: always
    depends_on:
      - backend
    networks:
      - sos_internal
      - wagmoo_wagmoo_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wagmoo_wagmoo_net"
      - "traefik.http.routers.sos-admin-v2.rule=Host(`admin.sosplanete.nnauru.net`)"
      - "traefik.http.routers.sos-admin-v2.entrypoints=websecure"
      - "traefik.http.routers.sos-admin-v2.tls.certresolver=myresolver"
      - "traefik.http.services.sos-admin-v2.loadbalancer.server.port=3010"

  jeu:
    build: ./apps/sosplanete-v1
    container_name: sos_jeu_v1
    restart: always
    depends_on:
      - backend
    networks:
      - sos_internal
      - wagmoo_wagmoo_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wagmoo_wagmoo_net"
      - "traefik.http.routers.sos-jeu.rule=Host(`sosplanete.nnauru.net`)"
      - "traefik.http.routers.sos-jeu.entrypoints=websecure"
      - "traefik.http.routers.sos-jeu.tls.certresolver=myresolver"
      - "traefik.http.services.sos-jeu.loadbalancer.server.port=80"

  evoe-frontend:
    build:
      context: ./apps/evoe-frontend
    container_name: sos_evoe_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - sos_internal
      - wagmoo_wagmoo_net
    environment:
      - VITE_API_URL=https://api.sosplanete.nnauru.net/legacy
      - VITE_EVOE_API_URL=https://api.sosplanete.nnauru.net/evoe
      - VITE_IMG_ROOT_URL=https://api.sosplanete.nnauru.net/static/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wagmoo_wagmoo_net"
      - "traefik.http.routers.sos-evoe.rule=Host(`evoe.nnauru.net`)"
      - "traefik.http.routers.sos-evoe.entrypoints=websecure"
      - "traefik.http.routers.sos-evoe.tls.certresolver=myresolver"
      - "traefik.http.services.sos-evoe.loadbalancer.server.port=5174"

  evolution-api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: sos_evolution_api
    restart: always
    environment:
      - SERVER_URL=http://evolution-api:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-EVOE_SECRET_WHATSAPP_KEY_2026}
      - DATABASE_PROVIDER=local
      - DATABASE_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - sos_internal
      - wagmoo_wagmoo_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=wagmoo_wagmoo_net"
      - "traefik.http.routers.sos-whatsapp.rule=Host(`whatsapp.nnauru.net`)"
      - "traefik.http.routers.sos-whatsapp.entrypoints=websecure"
      - "traefik.http.routers.sos-whatsapp.tls.certresolver=myresolver"
      - "traefik.http.services.sos-whatsapp.loadbalancer.server.port=8080"

networks:
  sos_internal:
  wagmoo_wagmoo_net:
    external: true

volumes:
  sos_db_data_v2:
  evolution_instances:
